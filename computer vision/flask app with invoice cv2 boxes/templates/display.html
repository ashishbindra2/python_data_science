<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <div class="row">
        <div class="col">
            <label style="margin-left: 300px;">Image Name: {{filename}}</label>
            <img src="data:image/png;base64,{{encoded_image}}"
                height="500px"
                alt="Invoice Image" class="img-fluid"
                title="Invoice image whhich is uploaded by you" />
        </div>
        <div class="col">
            <label style="margin-left: 300px;">Image Name: {{types}}</label>
            <img src="data:image/png;base64,{{encoded_image_detected}}"
                height="500px"
                alt="Invoice Image" class="img-fluid"
                title="Invoice image whhich is uploaded by you" />
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
